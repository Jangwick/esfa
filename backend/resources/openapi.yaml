      "Settings": {
        "type": "object",
        "properties": {
          "company_name": {
            "type": "string",
            "maxLength": 255
          },
          "support_email": {
            "type": "string",
            "format": "email"
          },
          "business_timezone": {
            "type": "string",
            "description": "IANA timezone; defaults to Asia/Manila."
          },
          "currency": {
            "type": "string",
            "const": "PHP"
          },
          "sla_policies": {
            "$ref": "#/components/schemas/SlaPolicies",
            "readOnly": true,
            "description": "Fallback SLA hours. Read-only here (sending it returns 422); edit them with PUT /support/sla-policies."
          },
          "auto_assign": {
            "type": "boolean"
          },
          "ticket_waiting_auto_resolve_days": {
            "type": "integer",
            "minimum": 0,
            "maximum": 90,
            "default": 0,
            "description": "Scheduled work resolves tickets that have waited on the customer this many days with no reply from the requester, tagged auto_resolved; 0 turns the rule off."
          },
          "ticket_auto_acknowledge": {
            "type": "boolean",
            "default": false,
            "description": "Add a public automatic reply with the first-response target to each new ticket and send it to the owning client as ticket.replied. It does not count as the first response."
          },
          "risk_failed_attempts": {
            "type": "integer",
            "minimum": 1,
            "maximum": 1000
          },
          "risk_amount_threshold": {
            "type": "integer",
            "minimum": 0,
            "maximum": 9000000000000000,
            "description": "Integer Philippine centavos; PHP is the only supported currency. No floating-point amounts."
          },
          "settlement_schedule": {
            "type": "string",
            "enum": [
              "weekly",
              "monthly"
            ]
          },
          "volumetric_divisor": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100000,
            "default": 3500
          },
          "webhook_auto_recover": {
            "type": "boolean",
            "default": true,
            "description": "Probe endpoints the system disabled about once an hour and re-enable them on a 2xx."
          },
          "auto_capture_authorized": {
            "type": "boolean",
            "default": true,
            "description": "Scheduled work captures payments the gateway authorizes later (not COD, risk reviews or cancelled orders)."
          },
          "finance_reminder_hours": {
            "type": "integer",
            "minimum": 0,
            "maximum": 168,
            "default": 4,
            "description": "Hours before Finance is reminded about a refund awaiting approval or an open risk review; disputes alert on the next run. 0 = off."
          },
          "risk_auto_clear_min_captured": {
            "type": "integer",
            "minimum": 0,
            "maximum": 1000,
            "default": 0,
            "description": "Scheduled work clears and captures an open risk review (status pending or authorized, risk review, order not cancelled) when the customer already has this many captured payments, has no disputed or lost payment, has no more failed attempts in the last hour than risk_failed_attempts, and the amount is within risk_auto_clear_max_amount. Writes an audit row with automation risk_auto_clear. 0 turns the rule off."
          },
          "risk_auto_clear_max_amount": {
            "type": "integer",
            "minimum": 1,
            "maximum": 9000000000000000,
            "description": "Largest payment amount, in centavos, that risk_auto_clear_min_captured may clear.",
            "default": 10000000
          },
          "refund_auto_approve_cap_amount": {
            "type": "integer",
            "minimum": 0,
            "maximum": 9000000000000000,
            "description": "A refund requested by staff (POST /refunds) up to this amount, in centavos, is approved and sent to the gateway at once when its reason is in refund_auto_approve_reasons, its payment has no earlier automatic approval, and the requester stays within refund_auto_approve_daily_limit. approved_by stays null and an audit row with automation refund_auto_approve is written. Integration refunds always wait for an approver. 0 turns the rule off.",
            "default": 0
          },
          "refund_auto_approve_daily_limit": {
            "type": "integer",
            "minimum": 1,
            "maximum": 9000000000000000,
            "description": "Most that one requester's automatically approved refunds may add up to per business day, in centavos. Failed refunds do not count.",
            "default": 200000
          },
          "refund_auto_approve_reasons": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "item_not_received",
                "damaged",
                "wrong_item",
                "cancelled_order",
                "duplicate_charge",
                "other"
              ]
            },
            "uniqueItems": true,
            "default": [
              "item_not_received",
              "damaged",
              "wrong_item",
              "cancelled_order",
              "duplicate_charge"
            ],
            "description": "Refund reasons that qualify for automatic approval; an empty list approves nothing automatically."
          },
          "risk_review_hold_hours": {
            "type": "integer",
            "minimum": 0,
            "maximum": 168,
            "default": 0,
            "description": "A pending or authorized payment under risk review expires this many hours after it was created instead of after 30 minutes; scheduled work moves its expires_at (payments_held_for_review). 0 turns the hold off."
          },
          "settlement_auto_finalize_days": {
            "type": "integer",
            "minimum": 0,
            "maximum": 30,
            "default": 0,
            "description": "Scheduled work finalizes draft settlements it generated once they are this many days old, when net payable is zero or more. Drafts rebuilt after a void (Void holds a period), and drafts with a disputed or lost payment or a requested, approved or processing refund, stay drafts. 0 turns the rule off."
          },
          "token_expiry_reminder_days": {
            "type": "integer",
            "minimum": 0,
            "maximum": 90,
            "default": 7,
            "description": "Remind users who manage integrations this many days before an integration token expires, once per token; 0 turns reminders off."
          },
          "notification_retention_days": {
            "type": "integer",
            "minimum": 0,
            "maximum": 3650,
            "default": 90,
            "description": "Delete read notifications older than this many days; 0 keeps them. Unread notifications are never deleted."
          },
          "logistics_stuck_hours": {
            "type": "integer",
            "minimum": 0,
            "maximum": 720,
            "default": 48,
            "description": "Alert users who edit shipments when an undelivered shipment has had no tracking event for this many hours, again only after a newer event; 0 turns stuck alerts off. Overdue alerts are always on."
          },
          "logistics_auto_ticket": {
            "type": "boolean",
            "default": true,
            "description": "A failed delivery attempt opens a delivery ticket for the customer (channel system) or notes the open one; the third attempt raises it to high priority and a delivery notes it."
          },
          "logistics_courier_fill_gaps": {
            "type": "boolean",
            "default": false,
            "description": "When a courier webhook skips forward steps (for example pending to picked_up), record the skipped steps first, noted as inferred. Delivered is never inferred."
          },
          "logistics_courier_pod": {
            "type": "boolean",
            "default": false,
            "description": "Accept recipient_name and proof_photo on a courier delivered event as proof of delivery for a prepaid (cod_amount 0) shipment that is out for delivery. COD shipments always need staff proof with cash collection."
          },
          "ai_enabled": {
            "type": "boolean",
            "default": false,
            "description": "Master switch for the AI assistant (Google Gemini). While false nothing is sent to Gemini."
          },
          "ai_ticket_triage": {
            "type": "boolean",
            "default": false,
            "description": "Label new tickets (category when empty, raise-only priority, tags, sentiment)."
          },
          "ai_reply_drafts": {
            "type": "boolean",
            "default": false,
            "description": "POST /support/tickets/{ticket}/ai-draft."
          },
          "ai_finance_review": {
            "type": "boolean",
            "default": false,
            "description": "AI review of risk reviews and refund requests (suggestions only)."
          },
          "ai_risk_second_opinion": {
            "type": "boolean",
            "default": false,
            "description": "Scheduled work adds uncaptured payments that look wrong to Risk reviews; captured ones only notify Finance."
          },
          "ai_address_fill": {
            "type": "boolean",
            "default": false,
            "description": "POST /logistics/address/parse."
          },
          "ai_delivery_reason": {
            "type": "boolean",
            "default": false,
            "description": "Classify the courier note on a failed attempt into the delivery ticket."
          },
          "ai_ask_data": {
            "type": "boolean",
            "default": false,
            "description": "POST /analytics/ask."
          },
          "ai_daily_token_limit": {
            "type": "integer",
            "minimum": 0,
            "maximum": 1000000000,
            "default": 1000000,
            "description": "Tokens (prompt, answer and thinking) all AI features may use per day; 0 = no AI."
          },
          "timezones": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "readOnly": true,
            "description": "GET only: every business_timezone value the server accepts (PHP timezone_identifiers_list). Ignored on PUT."
          },
          "settlement_carry_forward": {
            "type": "boolean",
            "default": false,
            "description": "When a settlement is generated for a seller with sales in the period, the net payable of their finalized negative settlements not yet recovered is added as adjustments_amount, and each of those settlements records recovered_by_settlement_id. Voiding the draft releases them. No ledger entries are written."
          },
          "default_plan_id": {
            "anyOf": [
              {
                "type": "integer",
                "minimum": 1
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "description": "Scheduled work subscribes every seller that never had a subscription to this plan, monthly, with a system audit row; subscription.created goes only to the seller's own client. The plan must be active with both prices 0 and no commission_rate_bp (422 otherwise); a plan that stops qualifying is skipped. null turns the rule off."
          },
          "refund_window_days": {
            "type": "integer",
            "minimum": 1,
            "maximum": 365,
            "default": 15,
            "description": "REF-3: a refund is requested within this many days of delivery, or of payment when nothing was delivered."
          },
          "refund_max_per_30_days": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100,
            "default": 2,
            "description": "REF-5 (advisory): most approved or completed refunds a customer may have had in the last 30 days."
          },
          "risk_amount_multiple": {
            "type": "integer",
            "minimum": 1,
            "maximum": 1000,
            "default": 5,
            "description": "RSK-3 (advisory): a payment is at most this many times the customer's largest captured payment."
          },
          "risk_new_customer_days": {
            "type": "integer",
            "minimum": 0,
            "maximum": 365,
            "default": 7,
            "description": "RSK-4 (advisory): the customer record is at least this many days old."
          }
        }
      },
