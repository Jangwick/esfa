  "info": {
    "title": "Archon Nell Support, Finance & Administration API",
    "version": "1.0.0",
    "description": "Back-office staff and scoped sibling-system integrations under /api/v1. All amounts are integer centavos in PHP, percentages are basis points, and instants are UTC. Models may include loaded relations. Staff and integration tokens are isolated. This document is authored in JSON syntax, a valid YAML 1.2 subset."
  },
  "servers": [
    {
      "url": "http://localhost:8000",
      "description": "Local Laravel API"
    },
    {
      "url": "/",
      "description": "Same-origin deployed API"
    }
  ],
