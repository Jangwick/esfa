    "responses": {
      "Unauthenticated": {
        "description": "Missing, expired, revoked or inactive bearer identity. Staff and integration credentials cannot cross their API boundaries.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            },
            "example": {
              "message": "Unauthenticated."
            }
          }
        }
      },
      "Forbidden": {
        "description": "The staff role, permission, integration scope or token class does not authorize this action.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            },
            "example": {
              "message": "This action requires the appropriate permission."
            }
          }
        }
      },
      "NotFound": {
        "description": "Record not found or not visible to this identity or source system.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            },
            "example": {
              "message": "Not Found"
            }
          }
        }
      },
      "ValidationError": {
        "description": "Invalid fields, incompatible links, money limits, invalid state transition or idempotency conflict.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "example": {
              "message": "The given data was invalid.",
              "errors": {
                "amount": [
                  "The amount exceeds the captured balance."
                ]
              }
            }
          }
        }
      },
      "RateLimited": {
        "description": "Request limit, email lockout or OTP resend cooldown. Retry after the header delay.",
        "headers": {
          "Retry-After": {
            "description": "Seconds until the next permitted attempt.",
            "schema": {
              "type": "integer",
              "minimum": 1
            }
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/RateLimitError"
            },
            "example": {
              "message": "Too many requests.",
              "retry_after": 60
            }
          }
        }
      }
    }
