    "/api/v1/support/tickets/{ticket}/ai-draft": {
      "post": {
        "operationId": "post_support_tickets_ticket_ai_draft",
        "tags": [
          "Customer support"
        ],
        "summary": "POST /support/tickets/{ticket}/ai-draft",
        "description": "Requires edit tickets and access to the ticket (a Support Agent: their own or unassigned tickets). Asks Google Gemini for a reply draft built from the published knowledge base, shared canned responses, the last 10 public messages (emails, phone numbers and long numbers masked) and the linked order, payment and shipment the caller may view. SFA checks the draft against the reply guidelines RPL-1..RPL-5 and Gemini judges RPL-6 and RPL-7 (see GET /ai/rules); needs_correction is true when a required rule fails. Nothing is sent or changed; the answer is stored in ai_insights and the same input returns the stored draft unless fresh is true. 422 when ai_enabled or ai_reply_drafts is off, no key is set, the daily token limit is reached, or the ticket is closed; 503 when Gemini is busy, times out, declines or answers in an unusable form. Limited to 20 requests a minute per user.",
        "parameters": [
          {
            "name": "ticket",
            "in": "path",
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 1
            }
          }
        ],
        "responses": {
          "401": {
            "$ref": "#/components/responses/Unauthenticated"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "422": {
            "$ref": "#/components/responses/ValidationError"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "503": {
            "description": "Gemini could not give a usable answer (busy, timed out, declined or malformed); the message says which. Nothing was changed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "200": {
            "description": "Successful response.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AiReplyDraft"
                }
              }
            }
          }
        },
        "security": [
          {
            "StaffBearer": []
          }
        ],
        "x-authorization": "Active staff session with the module permission and role visibility rules; Admin-only user and integration administration.",
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "fresh": {
                    "type": "boolean",
                    "description": "Ask Gemini again even when nothing changed."
                  }
                }
              }
            }
          }
        }
      }
    },
