    "/api/v1/login": {
      "post": {
        "operationId": "post_login",
        "tags": [
          "Authentication"
        ],
        "summary": "POST /login",
        "description": "Sign in with an active staff account. Five failed attempts are free; failure six locks the email for five minutes, seven for ten minutes, and eight or later for 24 hours (a 24-hour lock on a staff account notifies active Admins with sign_in_locked). Successful login or a quiet day resets the counter. OTP configuration off/bound/all may return a challenge instead of a token.",
        "responses": {
          "401": {
            "$ref": "#/components/responses/Unauthenticated"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "422": {
            "$ref": "#/components/responses/ValidationError"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "502": {
            "description": "Code email delivery failed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "200": {
            "description": "Successful response.",
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "$ref": "#/components/schemas/LoginResult"
                    },
                    {
                      "$ref": "#/components/schemas/OtpChallenge"
                    }
                  ]
                }
              }
            }
          }
        },
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LoginInput"
              },
              "example": {
                "email": "admin@example.com",
                "password": "password"
              }
            }
          }
        }
      }
    },
