        ],
        "summary": "POST /webhooks/couriers/{courierCode}",
        "description": "Signed courier status update (X-SFA-Signature, five-minute tolerance), matched by courier and tracking number; a repeated event id returns duplicate: true. With logistics_courier_fill_gaps on, skipped forward steps are recorded first as inferred events (delivered is never inferred). With logistics_courier_pod on, a delivered event with recipient_name and proof_photo records the proof and delivers a prepaid out-for-delivery shipment; a COD shipment, the setting off, or a photo that is not valid base64 PNG/JPG/WEBP up to 2 MB returns 422. A refused event returns 422 and notifies users who edit shipments once per event id (courier_event_rejected).",
