  "paths": {
    "/api/v1/ai/rules": {
      "get": {
        "operationId": "get_ai_rules",
        "tags": [
          "Administration"
        ],
        "summary": "GET /ai/rules",
        "description": "Any signed-in staff member (no extra permission; integration tokens get 403). The rulebooks every AI feature checks, in order (refund, risk, reply, triage, address, delivery, ask): each rule's id, kind (sfa: checked by SFA's own code; ai: judged by Google Gemini), severity (required or advisory) and description with the current settings filled in, plus the failed-delivery playbook. Nothing is sent to Gemini.",
        "responses": {
          "401": {
            "$ref": "#/components/responses/Unauthenticated"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "422": {
            "$ref": "#/components/responses/ValidationError"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "200": {
            "description": "Successful response.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AiRulebooks"
                }
              }
            }
          }
        },
        "security": [
          {
            "StaffBearer": []
          }
        ],
        "x-authorization": "Active staff session with the module permission and role visibility rules; Admin-only user and integration administration."
      }
    },
    "/api/v1/analytics/ask": {
      "post": {
        "operationId": "post_analytics_ask",
        "tags": [
          "Analytics & reports"
        ],
        "summary": "POST /analytics/ask",
        "description": "Requires view analytics. Google Gemini answers a question by calling SFA read-only report functions (the same summary and reports as GET /analytics, with the caller permissions and validated filters), at most 4 rounds; it never queries the database. Emails, phone numbers and long numbers in the question are masked. Each question is kept in ai_insights instead of the audit log. checks reports the reporting rulebook ASK-1..ASK-3 (see GET /ai/rules). 422 when the question is missing or ai_enabled/ai_ask_data is off, no key is set or the daily limit is reached; 503 when Gemini fails or does not finish. Limited to 10 requests a minute per user.",
        "responses": {
          "401": {
            "$ref": "#/components/responses/Unauthenticated"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "422": {
            "$ref": "#/components/responses/ValidationError"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "503": {
            "description": "Gemini could not give a usable answer (busy, timed out, declined or malformed); the message says which. Nothing was changed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "200": {
            "description": "Successful response.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AiAnswer"
                }
              }
            }
          }
        },
        "security": [
          {
            "StaffBearer": []
          }
        ],
        "x-authorization": "Active staff session with the module permission and role visibility rules; Admin-only user and integration administration.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "question": {
                    "type": "string",
                    "minLength": 5,
                    "maxLength": 500
                  }
                },
                "required": [
                  "question"
                ]
              }
            }
          }
        }
      }
    },
