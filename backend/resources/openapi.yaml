    "/api/v1/logistics/address/parse": {
      "post": {
        "operationId": "post_logistics_address_parse",
        "tags": [
          "Logistics & locations"
        ],
        "summary": "POST /logistics/address/parse",
        "description": "Requires create or edit shipments (or warehouses). Google Gemini splits a pasted Philippine address into parts and SFA matches region, province, city and barangay to its own location tables, so every id comes from SFA (the city first; towns that share a name need the province). Nothing is saved; the form is filled for the person to check. A phone number is read by SFA and masked before anything is sent. checks reports the address rulebook ADR-1..ADR-4 (see GET /ai/rules). 422 when the text is missing or ai_enabled/ai_address_fill is off, no key is set or the daily limit is reached; 503 when Gemini fails. Limited to 20 requests a minute per user.",
        "responses": {
          "401": {
            "$ref": "#/components/responses/Unauthenticated"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "422": {
            "$ref": "#/components/responses/ValidationError"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "503": {
            "description": "Gemini could not give a usable answer (busy, timed out, declined or malformed); the message says which. Nothing was changed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "200": {
            "description": "Successful response.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AiAddress"
                }
              }
            }
          }
        },
        "security": [
          {
            "StaffBearer": []
          }
        ],
        "x-authorization": "Active staff session with the module permission and role visibility rules; Admin-only user and integration administration.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "text": {
                    "type": "string",
                    "minLength": 10,
                    "maxLength": 1000
                  }
                },
                "required": [
                  "text"
                ]
              }
            }
          }
        }
      }
    },
