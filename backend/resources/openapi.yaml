  "components": {
    "securitySchemes": {
      "StaffBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "Sanctum staff token",
        "description": "Active staff user, staff ability and server-side module permissions."
      },
      "IntegrationBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "Sanctum integration token",
        "description": "Active integration client. Required abilities are listed as x-required-scopes on each operation."
      },
      "CronBearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "The private CRON_SECRET environment value; this is separate from staff or integration tokens."
      },
      "WebhookSignature": {
        "type": "apiKey",
        "in": "header",
        "name": "X-SFA-Signature",
        "description": "t=<unix seconds>,v1=<HMAC-SHA256(secret, timestamp + period + exact raw body)>; maximum five-minute clock skew."
      }
    },
    "schemas": {
      "Money": {
        "type": "integer",
        "minimum": 0,
        "maximum": 9000000000000000,
        "description": "Integer Philippine centavos; PHP is the only supported currency. No floating-point amounts."
      },
      "Message": {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          }
        },
        "required": [
          "message"
        ]
      },
      "Error": {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          }
        },
        "required": [
          "message"
        ]
      },
      "ValidationError": {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          },
          "errors": {
            "type": "object",
            "additionalProperties": {
              "type": "array",
              "items": {
                "type": "string"
              }
            }
          }
        },
        "required": [
          "message",
          "errors"
        ]
      },
      "RateLimitError": {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          },
          "retry_after": {
            "type": "integer",
            "minimum": 1
          },
          "attempts_left": {
            "type": "integer",
            "minimum": 0
          }
        },
        "required": [
          "message"
        ]
      },
      "SchedulerResult": {
        "type": "object",
        "properties": {
          "ran": {
            "type": "boolean"
          },
          "paused": {
            "const": true,
            "description": "Present when SFA_SCHEDULER_ENABLED=false; nothing ran."
          },
          "webhook_attempts": {
            "type": "integer",
            "minimum": 0
          },
          "idempotency_pruned": {
            "type": "integer",
            "minimum": 0
          },
          "failed_jobs": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "description": "Jobs that threw; the other jobs still ran."
          },
          "finished_at": {
            "type": "string",
            "format": "date-time",
            "description": "UTC ISO 8601 instant. Display it in the configured business timezone."
          }
        },
        "required": [
          "ran"
        ],
        "additionalProperties": {
          "type": "integer",
          "minimum": 0,
          "description": "Count from a domain job, e.g. payments_expired or subscriptions_renewed."
        },
        "description": "Counts from one scheduler run. ran is false while another run holds the lock or while paused."
      },
      "AiCheck": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[A-Z]{3}-[0-9]+$",
            "description": "Rule id from GET /ai/rules, e.g. REF-3."
          },
          "kind": {
            "type": "string",
            "enum": [
              "sfa",
              "ai"
            ]
          },
          "severity": {
            "type": "string",
            "enum": [
              "required",
              "advisory"
            ]
          },
          "title": {
            "type": "string"
          },
          "result": {
            "type": "string",
            "enum": [
              "pass",
              "fail",
              "unclear",
              "not_applicable"
            ]
          },
          "detail": {
            "type": "string",
            "maxLength": 500,
            "description": "What SFA found, or the AI's reason, in a sentence staff can read."
          }
        },
        "required": [
          "id",
          "kind",
          "severity",
          "title",
          "result",
          "detail"
        ],
        "description": "One rule check. kind sfa: checked by SFA's own code from its records; kind ai: judged by Google Gemini. A rule nobody judged is unclear. The outcome is worked out from the checks in PHP: a failed required rule fails; an unclear required rule or a failed or unclear advisory rule needs review; not_applicable counts as passed."
      },
      "AiRulebooks": {
        "type": "object",
        "properties": {
          "books": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "name": {
                  "type": "string",
                  "enum": [
                    "refund",
                    "risk",
                    "reply",
                    "triage",
                    "address",
                    "delivery",
                    "ask"
                  ]
                },
                "title": {
                  "type": "string"
                },
                "used_by": {
                  "type": "string",
                  "description": "The AI feature that checks this rulebook."
                },
                "decision": {
                  "type": "string",
                  "description": "How the outcome follows from the rule results."
                },
                "rules": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "properties": {
                      "id": {
                        "type": "string",
                        "pattern": "^[A-Z]{3}-[0-9]+$"
                      },
                      "kind": {
                        "type": "string",
                        "enum": [
                          "sfa",
                          "ai"
                        ]
                      },
                      "severity": {
                        "type": "string",
                        "enum": [
                          "required",
                          "advisory"
                        ]
                      },
                      "title": {
                        "type": "string"
                      },
                      "description": {
                        "type": "string",
                        "description": "With the current settings filled in (refund_window_days, refund_max_per_30_days, risk_failed_attempts, risk_amount_multiple, risk_new_customer_days)."
                      }
                    },
                    "required": [
                      "id",
                      "kind",
                      "severity",
                      "title",
                      "description"
                    ]
                  }
                }
              },
              "required": [
                "name",
                "title",
                "used_by",
                "decision",
                "rules"
              ]
            },
            "description": "In this order: refund, risk, reply, triage, address, delivery, ask."
          },
          "delivery_playbook": {
            "type": "object",
            "properties": {
              "recipient_unavailable": {
                "type": "string"
              },
              "wrong_or_incomplete_address": {
                "type": "string"
              },
              "refused": {
                "type": "string"
              },
              "inaccessible_area": {
                "type": "string"
              },
              "cod_cash_not_ready": {
                "type": "string"
              },
              "rescheduled_by_customer": {
                "type": "string"
              },
              "other": {
                "type": "string"
              }
            },
            "required": [
              "recipient_unavailable",
              "wrong_or_incomplete_address",
              "refused",
              "inaccessible_area",
              "cod_cash_not_ready",
              "rescheduled_by_customer",
              "other"
            ],
            "description": "Failed-delivery reason the AI picks -> the next step staff take (fixed by SFA, not the AI)."
          }
        },
        "required": [
          "books",
          "delivery_playbook"
        ]
      },
      "AiReplyDraft": {
        "type": "object",
        "properties": {
          "reply": {
            "type": "string",
            "description": "Draft text for the agent to edit. {first_name} is the greeting placeholder the browser fills in; nothing is sent."
          },
          "sources": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "id": {
                  "type": "integer",
                  "minimum": 1
                },
                "title": {
                  "type": "string"
                }
              },
              "required": [
                "id",
                "title"
              ]
            },
            "description": "Published knowledge-base articles the draft used (ids the model cited that were not sent are dropped)."
          },
          "confidence": {
            "type": "string",
            "enum": [
              "high",
              "medium",
              "low"
            ]
          },
          "needs_human_reason": {
            "anyOf": [
              {
                "type": "string",
                "description": "What the agent must check before sending, when the facts given do not answer the request."
              },
              {
                "type": "null"
              }
            ]
          },
          "checks": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/AiCheck"
            },
            "description": "Every rule of the feature's rulebook (GET /ai/rules) in order, with the result SFA or the AI gave it."
          },
          "needs_correction": {
            "type": "boolean",
            "description": "True when a required reply rule fails (RPL-1, RPL-2, RPL-3 or RPL-6); the screen shows Fix before sending."
          },
          "created_at": {
            "type": "string",
            "format": "date-time",
            "description": "UTC ISO 8601 instant. Display it in the configured business timezone."
          }
        },
        "required": [
          "reply",
          "sources",
          "confidence",
          "needs_human_reason",
          "checks",
          "needs_correction",
          "created_at"
        ]
      },
      "AiRiskReview": {
        "type": "object",
        "properties": {
          "recommendation": {
            "type": "string",
            "enum": [
              "clear",
              "block",
              "need_more_info"
            ]
          },
          "confidence": {
            "type": "string",
            "enum": [
              "high",
              "medium",
              "low"
            ]
          },
          "summary": {
            "type": "string"
          },
          "reasons": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "maxItems": 5
          },
          "checks": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/AiCheck"
            },
            "description": "RSK-1 to RSK-5 in order: SFA checks RSK-1..RSK-4 from its records, the AI judges RSK-5."
          },
          "flagged_because": {
